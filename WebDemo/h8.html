<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #d1{
            width: 200px;
            height: 200px;
            background-color: lightblue;
            float: left;
        }
        #d2{
            width: 200px;
            height: 400px;
            background-color: yellowgreen;
            float: left;
            
        }
        #d3{
            width: 300px;
            height: 300px;
            background-color: pink;
            float: right;
        }
        #d4{
            width: 700px;
            height: 200px;
            background-color: yellow;
        }

        .clearFloat{
            clear: both;
        }
    </style>
</head>
<body>
    <div id="d1"></div>
    <div id="d2"></div>
    <div id="d3"></div>
    <!-- if you want everything back to normal after float, then you need to clear float -->
     <div class="clearFloat"></div>
    <div id="d4"></div>
</body>
</html>
