<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
        link-> visited ->hover ->active
        */
        a:link{
            color: bisque;
        }
        a:visited{
            color: aqua;
        }
        a:hover{
            color: red;
        }
        a:active{
            color: yellow;
        }
    </style>
</head>
<body>
    <!-- 
    4 statements/pseudo class:
    link(unvisited)
    hover(mouse upon it)
    active(clicking on it)
    visited(visited):
    
    selector:pseudo{
        style1:value1;
        style2:valuee2
    }
    -->
    <a href="h1.html">visit h1 page</a>
    <a href="http://www.aabbcc.com">visit aabbcc page</a>
</body>
</html>
